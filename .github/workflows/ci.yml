name: CI
on: [push, pull_request]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m compileall -q app
      - run: ruff check app tests
      - name: Generate video lockfile
        working-directory: video
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated video lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock video dependencies"
            git push origin HEAD:feat/phase5-qa-orchestration
          fi
      - name: Install video dependencies
        working-directory: video
        run: npm ci
      - name: Test video project
        working-directory: video
        run: npm test
      - name: Typecheck video project
        working-directory: video
        run: npm run typecheck
      - name: Smoke render professional composition
        working-directory: video
        run: npx remotion render src/index.ts KernelRushLong /tmp/autotube-smoke.mp4 --props=smoke-props.json --frames=0-0
      - name: Smoke render native Short composition
        working-directory: video
        run: npx remotion render src/index.ts KernelRushShort /tmp/autotube-short-smoke.mp4 --props=smoke-short-props.json --frames=0-0
