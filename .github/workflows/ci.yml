name: CI
on: [push, pull_request]

# Rendering a real Windows package is intentionally expensive. When several
# commits land quickly on the same branch, keep only the newest validation run.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m compileall -q app
      - run: ruff check app tests
      - name: Install video dependencies
        working-directory: video
        run: npm ci
      - name: Test video project
        working-directory: video
        run: npm test
      - name: Typecheck video project
        working-directory: video
        run: npm run typecheck
      - name: Smoke render professional composition
        working-directory: video
        run: npx remotion render src/index.ts KernelRushLong /tmp/autotube-smoke.mp4 --props=smoke-props.json --frames=0-0 --gl=angle
      - name: Smoke render native Short composition
        working-directory: video
        run: npx remotion render src/index.ts KernelRushShort /tmp/autotube-short-smoke.mp4 --props=smoke-short-props.json --frames=0-0 --gl=angle

  windows-real-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install FFmpeg and FFprobe
        run: choco install ffmpeg -y --no-progress
      - run: python -m pip install -e .
      - name: Install video dependencies
        working-directory: video
        run: npm ci
      - name: Render real KernelRush package through Python runner
        run: python tests/windows_render_smoke.py
