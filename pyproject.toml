[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autotube-lab"
version = "0.1.0"
description = "Autonomous two-channel YouTube research, production, publishing and learning engine"
requires-python = ">=3.11"
dependencies = ["Pillow>=10", "PyYAML>=6"]

[project.optional-dependencies]
youtube = ["google-api-python-client>=2.150", "google-auth-oauthlib>=1.2", "google-auth-httplib2>=0.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
autotube = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
